version: '3.8'

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: insforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: insforge
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ─── PostgREST (API base de données) ────────────────────────────────────────
  postgrest:
    image: postgrest/postgrest:v12.2.8
    container_name: insforge-postgrest
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/insforge
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: web_anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_MAX_ROWS: 10000
      PGRST_SERVER_PORT: 3000
      PGRST_LOG_LEVEL: error
    depends_on:
      postgres:
        condition: service_healthy
    # Non exposé à l'hôte — accessible uniquement en interne

  # ─── Gateway InsForge (auth + proxy DB + storage) ────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: insforge-gateway
    container_name: insforge
    restart: unless-stopped
    ports:
      - "7130:7130"
    environment:
      PORT: 7130
      POSTGRES_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres123}@postgres:5432/insforge
      POSTGREST_URL: http://postgrest:3000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY: 3600
      STORAGE_PATH: /data/storage
      APP_URL: ${APP_URL:-http://localhost:5173}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_ENTERPRISE: ${STRIPE_PRICE_ENTERPRISE:-}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-}
      SQUARE_ENVIRONMENT: ${SQUARE_ENVIRONMENT:-sandbox}
      SQUARE_LOCATION_ID: ${SQUARE_LOCATION_ID:-}
      SQUARE_PLAN_STARTER: ${SQUARE_PLAN_STARTER:-}
      SQUARE_PLAN_PRO: ${SQUARE_PLAN_PRO:-}
      SQUARE_PLAN_ENTERPRISE: ${SQUARE_PLAN_ENTERPRISE:-}
      SQUARE_WEBHOOK_SIGNATURE_KEY: ${SQUARE_WEBHOOK_SIGNATURE_KEY:-}
      # Email (SMTP explicite ou Gmail OAuth2)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      GMAIL_USER: ${GMAIL_USER:-}
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Deno — runtime des fonctions ────────────────────────────────────────────
  deno:
    build:
      context: ./deno-runner
      dockerfile: Dockerfile
    image: insforge-deno
    container_name: insforge-deno
    restart: unless-stopped
    ports:
      - "7133:7133"
    environment:
      DENO_PORT: 7133
      FUNCTIONS_DIR: /functions
      # Base de données (PostgREST interne)
      SUPABASE_URL: http://postgrest:3000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Autre
      JWT_SECRET: ${JWT_SECRET}
      INSFORGE_INTERNAL_URL: http://insforge:7130
      INTERNAL_API_TOKEN: ${SUPABASE_SERVICE_ROLE_KEY}
      DENO_RUNTIME_URL: http://deno:7133
      # Intégrations
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TWILIO_SID: ${TWILIO_SID:-}
      TWILIO_TOKEN: ${TWILIO_TOKEN:-}
      TWILIO_PHONE: ${TWILIO_PHONE:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      WEBHOOK_SECRET_ELEVEN: ${WEBHOOK_SECRET_ELEVEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      AIRTABLE_API_KEY: ${AIRTABLE_API_KEY:-}
      AIRTABLE_BASE_ID: ${AIRTABLE_BASE_ID:-}
    volumes:
      - ../functions:/functions:ro
    depends_on:
      - gateway

volumes:
  postgres_data:
  storage_data:
